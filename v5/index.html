<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Dinámico</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Body con transición para los cambios de fondo */
        body {
            transition: background-color 0.3s ease-in-out, background-image 0.3s ease-in-out;
            background-size: cover;
            background-position: center;
        }

        /* Escondemos los formularios con la clase 'hidden' */
        .hidden {
            display: none;
        }

        /* Estilo para la tarjeta de los formularios */
        .form-card {
            transition: opacity 0.3s ease-in-out;
            padding: 20px;
        }

        /* Aseguramos que la tarjeta no sea demasiado grande */
        .select-card {
            max-width: 500px;
            margin: auto;
        }

        /* Ajustes responsivos */
        @media (max-width: 767px) {
            .form-card {
                padding: 15px;
            }

            .select-card {
                max-width: 100%;
                padding: 10px;
            }

            .form-card h3, .select-card h3 {
                font-size: 1.5rem;
            }

            .form-card .form-label, .select-card .form-label {
                font-size: 0.9rem;
            }

            .form-card .form-control, .select-card .form-select {
                font-size: 0.9rem;
            }

            .form-card .btn, .select-card .btn {
                font-size: 0.9rem;
            }
        }
    </style>
</head>

<body>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <!-- Card de selección de evento -->
            <div class="col-md-6 select-card" id="form-selection-card">
                <div class="card p-4 shadow-lg">
                    <h3 class="text-center mb-4">Seleccione un Evento</h3>
                    <div class="form-group">
                        <label for="eventoSelect" class="form-label">Seleccione el formulario</label>
                        <select class="form-select" id="eventoSelect">
                            <option value="">Seleccione un evento</option>
                            <option value="casa-sinergia">Casa Sinergia en Navidad</option>
                            <option value="servientrega">Ingreso a instalaciones Servientrega</option>
                        </select>
                    </div>
                    <button id="continueButton" class="btn btn-primary w-100 mt-3 hidden">Continuar</button>
                </div>
            </div>

            <!-- Formulario de Casa Sinergia (oculto inicialmente) -->
            <div id="casa-sinergia-form" class="form-card hidden">
                <h3>Formulario Casa Sinergia</h3>
                <form>
                    <div class="mb-3">
                        <label for="empresa" class="form-label">Empresa:</label>
                        <input type="text" class="form-control" id="empresa" name="empresa" required
                            data-bs-toggle="tooltip" title="Introduce el nombre de la empresa que representa.">
                    </div>
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre:</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" required
                            data-bs-toggle="tooltip" title="Introduce tu primer nombre.">
                    </div>
                    <div class="mb-3">
                        <label for="apellidos" class="form-label">Apellidos:</label>
                        <input type="text" class="form-control" id="apellidos" name="apellidos" required
                            data-bs-toggle="tooltip" title="Introduce tus apellidos.">
                    </div>
                    <div class="mb-3">
                        <label for="correo" class="form-label">Correo Electrónico:</label>
                        <input type="email" class="form-control" id="correo" name="correo" required
                            data-bs-toggle="tooltip" title="Introduce tu correo electrónico.">
                    </div>
                    <div class="mb-3">
                        <label for="cedula" class="form-label">Cédula:</label>
                        <input type="text" class="form-control" id="cedula" name="cedula" required
                            data-bs-toggle="tooltip" title="Introduce tu número de cédula.">
                    </div>
                    <div class="mb-3">
                        <label for="cargo" class="form-label">Cargo:</label>
                        <input type="text" class="form-control" id="cargo" name="cargo" required
                            data-bs-toggle="tooltip" title="Introduce tu cargo dentro de la empresa.">
                    </div>
                    <div class="mb-3">
                        <label for="anfitrion" class="form-label">Anfitrión:</label>
                        <input type="text" class="form-control" id="anfitrion" name="anfitrion"
                            data-bs-toggle="tooltip" title="Introduce el nombre del anfitrión, si aplica.">
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="politicasCasa" name="politicasCasa" required
                            data-bs-toggle="tooltip" title="Debes aceptar la política de tratamiento de datos.">
                        <label class="form-check-label" for="politicasCasa">
                            Al registrarte, aceptas nuestra <a href="#">Política de Tratamiento de Datos</a>.
                        </label>
                    </div>
                    <button type="submit" class="btn btn-success mt-3">Registrar</button>
                </form>
            </div>

            <!-- Formulario de Servientrega (oculto inicialmente) -->
            <div id="servientrega-form" class="form-card hidden">
                <h3>Formulario Ingreso a instalaciones Servientrega</h3>
                <form>
                    <div class="mb-3">
                        <label for="nombre_servientrega" class="form-label">Nombre:</label>
                        <input type="text" class="form-control" id="nombre_servientrega" name="nombre_servientrega" required
                            data-bs-toggle="tooltip" title="Introduce tu primer nombre.">
                    </div>
                    <div class="mb-3">
                        <label for="apellidos_servientrega" class="form-label">Apellidos:</label>
                        <input type="text" class="form-control" id="apellidos_servientrega" name="apellidos_servientrega" required
                            data-bs-toggle="tooltip" title="Introduce tus apellidos.">
                    </div>
                    <div class="mb-3">
                        <label for="correo_servientrega" class="form-label">Correo Electrónico:</label>
                        <input type="email" class="form-control" id="correo_servientrega" name="correo_servientrega" required
                            data-bs-toggle="tooltip" title="Introduce tu correo electrónico.">
                    </div>
                    <div class="mb-3">
                        <label for="cedula_servientrega" class="form-label">Cédula:</label>
                        <input type="text" class="form-control" id="cedula_servientrega" name="cedula_servientrega" required
                            data-bs-toggle="tooltip" title="Introduce tu número de cédula.">
                    </div>
                    <div class="mb-3">
                        <label for="cargo_servientrega" class="form-label">Cargo:</label>
                        <input type="text" class="form-control" id="cargo_servientrega" name="cargo_servientrega" required
                            data-bs-toggle="tooltip" title="Introduce tu cargo en la empresa.">
                    </div>
                    <div class="mb-3">
                        <label for="empresa_servientrega" class="form-label">Empresa:</label>
                        <input type="text" class="form-control" id="empresa_servientrega" name="empresa_servientrega" required
                            data-bs-toggle="tooltip" title="Introduce el nombre de la empresa.">
                    </div>
                    <div class="mb-3">
                        <label for="actividad_servientrega" class="form-label">Descripción de la actividad:</label>
                        <input type="text" class="form-control" id="actividad_servientrega" name="actividad_servientrega" required
                            data-bs-toggle="tooltip" title="Describe brevemente la actividad que realizarás.">
                    </div>
                    <div class="mb-3">
                        <label for="sede_servientrega" class="form-label">Sede:</label>
                        <select class="form-select" id="sede_servientrega" name="sede_servientrega" required
                            data-bs-toggle="tooltip" title="Selecciona la sede a la que asistirás.">
                            <option value="sede1">Sede 1</option>
                            <option value="sede2">Sede 2</option>
                            <option value="sede3">Sede 3</option>
                        </select>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="politicasServientrega" name="politicasServientrega" required
                            data-bs-toggle="tooltip" title="Debes aceptar la política de tratamiento de datos.">
                        <label class="form-check-label" for="politicasServientrega">
                            Al registrarte, aceptas nuestra <a href="#">Política de Tratamiento de Datos</a>.
                        </label>
                    </div>
                    <button type="submit" class="btn btn-success mt-3">Registrar</button>
                </form>
            </div>

        </div>
    </div>

    <!-- Bootstrap 5 JS + Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>

    <script>
        // Inicialización de tooltips
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
        var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl);
        });

        // Función para mostrar/ocultar formularios y cambiar el fondo
        const eventoSelect = document.getElementById('eventoSelect');
        const continueButton = document.getElementById('continueButton');
        const formSelectionCard = document.getElementById('form-selection-card');
        const casaSinergiaForm = document.getElementById('casa-sinergia-form');
        const servientregaForm = document.getElementById('servientrega-form');
        
        // Cambio de fondo según selección
        const body = document.body;

        eventoSelect.addEventListener('change', function() {
            const evento = eventoSelect.value;
            if (evento) {
                continueButton.classList.remove('hidden');
            } else {
                continueButton.classList.add('hidden');
            }
        });

        continueButton.addEventListener('click', function() {
            const evento = eventoSelect.value;
            formSelectionCard.classList.add('hidden');

            if (evento === 'casa-sinergia') {
                body.style.backgroundImage = 'url(Fondo3.webp)';  // Fondo Casa Sinergia
                casaSinergiaForm.classList.remove('hidden');
                servientregaForm.classList.add('hidden');
            } else if (evento === 'servientrega') {
                body.style.backgroundImage = 'url(Fondo2.webp)';  // Fondo Servientrega
                casaSinergiaForm.classList.add('hidden');
                servientregaForm.classList.remove('hidden');
            }
        });
    </script>

</body>

</html>
